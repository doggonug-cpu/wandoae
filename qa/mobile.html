<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>QA · 모바일 뷰 확인</title>
<style>html,body{margin:0;background:#222}iframe{display:block;width:390px;height:844px;border:0;background:#fff}</style>
</head><body>
<iframe id="f" src="https://wandoae.me/"></iframe>
<script>
  var y = Number(new URLSearchParams(location.search).get('y') || 0);
  document.getElementById('f').addEventListener('load', function () {
    try { this.contentWindow.scrollTo(0, y); } catch (e) {}
  });
</script>
</body></html>
